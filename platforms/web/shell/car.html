<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car · Tab5 驾驶舱</title>
<style>
/* ═══ car.html 轻量车机页 ═══
   纯 HTML/CSS/JS 单文件, 零依赖零构建。布局复刻 Tab5 主页,
   主题色值与 app/apps/utils/theme/theme.h kThemes 逐字对齐。
   禁用 window.innerHeight (L9 实测恒 0) — 布局全 CSS。 */
:root {
  --hero:#204234; --accent:#34D399; --press:#2F8066;
  --card0:#1B362C; --card1:#173024; --card2:#13291F; --card3:#0F221A;
  --border:#2C4433; --track:#0A1811; --page:#000000;
  --hi:#F2F7F3; --soft:#C7D6CB; --dim:#7E9486;
  --ok:#34D399; --warn:#FBBF24; --danger:#EF4444;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  background:var(--page); color:var(--hi);
  font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
button { font-family:inherit; touch-action:manipulation; cursor:pointer; }

.app { min-height:100vh; max-width:1600px; margin:0 auto;
       display:flex; flex-direction:column; }
.main { flex:1; display:flex; gap:12px; padding:12px; align-items:stretch; }

/* ── 卡片通用 (设备端: radius18 / 1px 边框 70% / card[i] 平色逐级加深) ── */
.card {
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  border-radius:18px; padding:14px 18px;
}
.c0 { background:var(--card0); } .c1 { background:var(--card1); }
.c2 { background:var(--card2); } .c3 { background:var(--card3); }
.head { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
.idx  { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
.nm   { color:var(--soft); font-size:14px; }
.val  { color:var(--hi); font-size:clamp(16px,1.5vw,20px); font-weight:600;
        font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub  { font-size:12px; margin-top:4px; }
.dim  { color:var(--dim); } .soft { color:var(--soft); }
.r    { margin-left:auto; }
.fr   { margin-left:auto; color:var(--dim); font-size:12px;
        font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ── Hero 左卡 ── */
.hero {
  flex:0 0 400px; width:400px; background:var(--hero);
  display:flex; flex-direction:column; padding:22px 26px;
}
.clock { font-size:clamp(56px,6vw,96px); font-weight:700; line-height:1.05;
         letter-spacing:2px; font-variant-numeric:tabular-nums; }
.clock .sec { font-size:.38em; font-weight:400; color:var(--dim); }
.hero-sub { font-size:clamp(16px,1.4vw,20px); color:var(--soft); margin-top:6px; }
.wx { font-size:clamp(20px,2vw,28px); font-weight:600; margin-top:14px; }
.wx .cond { font-size:.72em; font-weight:400; color:var(--soft); margin-left:8px; }
.rule { border-top:1px solid color-mix(in srgb, var(--border) 70%, transparent);
        margin:16px 0 12px; }
.sent { cursor:pointer; min-height:72px; }
.sent-en { font-size:clamp(15px,1.3vw,18px); line-height:1.45; color:var(--hi); }
.sent-cn { font-size:14px; margin-top:6px; line-height:1.5; }
.ipo { margin-top:14px; }
.ipo-t { font-size:13px; }
.ipo-list { font-size:14px; color:var(--hi); line-height:1.7;
            font-variant-numeric:tabular-nums; white-space:pre-line; }
.hero-foot { margin-top:auto; padding-top:14px;
             display:flex; align-items:center; gap:10px; }
.tbtn { background:var(--track); color:var(--soft); border:1px solid var(--border);
        border-radius:14px; padding:7px 14px; font-size:14px; }
.tbtn:active { background:var(--press); }
#theme-name { font-size:13px; }

/* ── 右列 6 卡 ── */
.col { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
.body { padding:2px 0; }

/* 01 GLM / DeepSeek */
.glm-grid { display:flex; align-items:center; gap:18px; }
.glm-grid .grow { min-width:0; }

/* 02 提醒/日程 */
.agenda { text-align:center; }
.agenda .a1 { color:var(--hi); font-size:clamp(15px,1.3vw,18px); line-height:1.5; }
.agenda .a2 { color:var(--dim); font-size:13px; margin-top:4px; }

/* 03 AI 新闻 */
.news { text-align:center; cursor:pointer; padding:6px 8px; }
.news .n1 { color:var(--hi); font-size:clamp(15px,1.3vw,18px); line-height:1.5;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.news .n2 { color:var(--dim); font-size:12px; margin-top:5px; }

/* 04 健康 4×2 */
.hgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px 12px; }
.hcell .hl { color:var(--dim); font-size:12px; white-space:nowrap; }
.hcell .hv { color:var(--hi); font-size:clamp(14px,1.2vw,17px); font-weight:600; margin-top:2px;
             font-variant-numeric:tabular-nums; white-space:nowrap; }

/* 05 OPi 3×2 + 阈值色条 */
.ogrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px; }
.omod .ol { color:var(--dim); font-size:12px; }
.omod .ov { color:var(--hi); font-size:14px; font-weight:600; margin:2px 0 5px;
            font-variant-numeric:tabular-nums; white-space:nowrap; }
.bar  { height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
.fill { height:100%; width:0%; border-radius:3px; background:var(--ok); }
.dot  { display:inline-block; width:9px; height:9px; border-radius:50%;
        background:var(--ok); margin-right:6px; vertical-align:baseline; }

/* 06 收音机 */
.chips { display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
         max-height:190px; overflow-y:auto; scrollbar-width:thin; }
.chip { background:transparent; color:var(--soft); border:1px solid var(--border);
        border-radius:10px; padding:6px 4px; font-size:13px; line-height:1.2;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip .fq { display:block; font-size:10px; color:var(--dim); }
.chip.on  { background:var(--press); color:var(--hi); border-color:var(--accent); }
.chip.on .fq { color:var(--hi); opacity:.75; }
.rctrl { display:flex; align-items:center; gap:12px; margin-top:12px; }
.pbtn  { width:52px; height:40px; border-radius:12px; border:1px solid var(--border);
         background:var(--press); color:var(--hi); font-size:17px; }
.rstat { color:var(--dim); font-size:13px; min-width:0; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap; }
.rvol { flex:1; touch-action:none; accent-color:var(--accent); height:4px; }

/* ── 底部 6 按钮 (设备主页风格位) ── */
.nav { position:sticky; bottom:0; display:flex; gap:12px; padding:12px;
       background:var(--page); }
.nav button { flex:1; height:56px; border-radius:20px; border:1px solid var(--border);
              background:var(--track); color:var(--soft); font-size:16px; }
.nav button:active { background:var(--press); color:var(--hi); }
.nav button.live { color:var(--hi); }

/* ── Toast (v2 提示 / 主题名 / 登录过期, 唯一浮层, 绝不弹错误框) ── */
#toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
         background:rgba(0,0,0,.78); color:#fff; padding:9px 18px; border-radius:22px;
         font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99;
         max-width:70vw; }

/* ═══ V2: 面板框架 (全屏覆盖层, 主题跟随) ═══ */
.panel { position:fixed; inset:0; z-index:50; background:var(--page);
         display:none; flex-direction:column; }
.panel.open { display:flex; }
.p-head { display:flex; align-items:center; gap:10px; padding:14px 18px; flex:none;
          border-bottom:1px solid color-mix(in srgb, var(--border) 70%, transparent); }
.p-title { color:var(--accent); font-size:18px; font-weight:600; }
.p-sub   { color:var(--dim); font-size:12px; min-width:0; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
.p-close { margin-left:auto; flex:none; width:42px; height:36px; border-radius:12px;
           border:1px solid var(--border); background:var(--track); color:var(--soft); font-size:16px; }
.p-close:active { background:var(--press); }
.p-body  { flex:1; overflow-y:auto; padding:14px 16px 28px; scrollbar-width:thin; }
.p-tabs  { display:flex; gap:8px; align-items:center; margin:2px 0 12px; }
.ptab { border:1px solid var(--border); background:transparent; color:var(--soft);
        border-radius:12px; padding:6px 16px; font-size:14px; }
.ptab.on { background:var(--press); color:var(--hi); border-color:var(--accent); }
.sec { color:var(--dim); font-size:12px; margin:14px 2px 8px; }
.up   { color:var(--danger); }   /* 涨红 (设备 C_UP=danger) */
.down { color:var(--ok); }       /* 跌绿 (设备 C_DOWN=ok) */
.flat { color:var(--dim); }

/* ── 智能家居 ── */
.ha-row { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
          border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
          border-radius:14px; background:var(--card1); }
.ha-name { color:var(--hi); font-size:15px; min-width:0; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
.ha-st   { color:var(--dim); font-size:12px; flex:none; }
.ha-btn  { margin-left:auto; flex:none; min-width:62px; height:36px; border-radius:10px;
           border:1px solid var(--border); background:var(--track); color:var(--soft);
           font-size:14px; padding:0 12px; }
.ha-btn.on { background:var(--ok); color:var(--page); border-color:transparent; font-weight:600; }
.ha-btn:active { background:var(--press); }
.ha-temp { color:var(--hi); font-size:15px; min-width:64px; text-align:center;
           font-variant-numeric:tabular-nums; }

/* ── 金融 ── */
.fgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
.fcard { border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
         border-radius:16px; padding:12px 14px; cursor:pointer; background:var(--card1); min-width:0; }
.fcard:active { border-color:var(--accent); }
.fcard .fnm { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.fcard .fn  { color:var(--soft); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fcard .fc  { color:var(--dim); font-size:11px; flex:none; }
.fcard .fpx { color:var(--hi); font-size:22px; font-weight:700; margin-top:6px;
              font-variant-numeric:tabular-nums; }
.fcard .fchg{ font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums; }
.fcard .fsen{ color:var(--dim); font-size:11px; margin-top:6px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
#chart { width:100%; height:420px; display:block; border-radius:14px; background:var(--card3);
         border:1px solid color-mix(in srgb, var(--border) 70%, transparent); }
#chart-title { margin-left:auto; color:var(--soft); font-size:13px; }
#chart-metrics { color:var(--dim); font-size:12px; margin-top:8px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }

/* ── 工具抽屉 ── */
.tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
.tool-card { border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
             border-radius:16px; background:var(--card1); padding:20px 12px;
             text-align:center; cursor:pointer; color:var(--hi); font-size:16px; }
.tool-card:active { background:var(--press); }
.tool-card .ticon { font-size:28px; margin-bottom:8px; }

/* ── 图库 ── */
.ggrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.ggrid img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:8px;
             cursor:pointer; background:var(--track); display:block; }
.viewer { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.93);
          display:none; align-items:center; justify-content:center; }
.viewer.open { display:flex; }
.viewer img { max-width:96vw; max-height:92vh; object-fit:contain; }
.v-btn { position:fixed; width:52px; height:52px; border-radius:50%; border:none;
         background:rgba(255,255,255,.14); color:#fff; font-size:24px; cursor:pointer; }
#v-prev { left:16px; top:50%; transform:translateY(-50%); }
#v-next { right:16px; top:50%; transform:translateY(-50%); }
#v-close { right:16px; top:14px; }
.v-n { position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
       color:rgba(255,255,255,.75); font-size:13px; }

/* ── 万年历 ── */
.cal-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.cal-title { color:var(--hi); font-size:18px; font-weight:600; min-width:130px; }
.cal-btn { border:1px solid var(--border); background:var(--track); color:var(--soft);
           border-radius:10px; padding:6px 12px; font-size:13px; }
.cal-btn:active { background:var(--press); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-wd { color:var(--dim); font-size:12px; text-align:center; }
.cal-wd.we { color:var(--danger); }
.cal-cell { border:1px solid transparent; border-radius:10px; padding:6px 2px;
            text-align:center; min-height:60px; cursor:pointer; }
.cal-cell .cd { color:var(--hi); font-size:17px; font-weight:600; }
.cal-cell.we .cd { color:var(--danger); }
.cal-cell .cl { color:var(--dim); font-size:11px; margin-top:3px; white-space:nowrap; }
.cal-cell.today { border-color:var(--accent); }
.cal-cell.pad { opacity:.25; cursor:default; }
.cal-detail { color:var(--soft); font-size:13px; margin-top:12px; text-align:center; }

/* ── 换算 ── */
.cv-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.cv-row input, .cv-row select { background:var(--track); border:1px solid var(--border);
    color:var(--hi); border-radius:10px; padding:9px 10px; font-size:15px; font-family:inherit; }
.cv-row input { flex:1; min-width:0; font-variant-numeric:tabular-nums; }
.cv-row select { max-width:46%; }
.cv-swap { flex:none; width:44px; height:40px; border-radius:10px; border:1px solid var(--border);
           background:var(--track); color:var(--soft); font-size:16px; }
.cv-res { color:var(--accent); font-size:22px; font-weight:700; margin-top:4px;
          font-variant-numeric:tabular-nums; word-break:break-all; }
.cv-upd { color:var(--dim); font-size:12px; margin-top:10px; }

/* ── 双色球 ── */
.ssq-latest { border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
              border-radius:16px; background:var(--card1); padding:14px 16px; }
.ssq-h { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.ssq-h .code { color:var(--hi); font-size:17px; font-weight:600; }
.ssq-h .dt   { color:var(--dim); font-size:12px; }
.ball { display:inline-flex; width:34px; height:34px; border-radius:50%; align-items:center;
        justify-content:center; font-size:15px; font-weight:700; margin:0 5px 5px 0;
        color:#fff; font-variant-numeric:tabular-nums; }
.ball.r { background:#D6362B; } .ball.b { background:#1F6BB0; }
.ssq-meta { color:var(--soft); font-size:13px; margin-top:8px; line-height:1.7; }
.ssq-row { display:flex; align-items:center; gap:4px; padding:8px 2px;
           border-bottom:1px dashed color-mix(in srgb, var(--border) 60%, transparent); }
.ssq-row .icode { color:var(--dim); font-size:12px; width:118px; flex:none;
                  font-variant-numeric:tabular-nums; }
.ssq-row .ball { width:26px; height:26px; font-size:12px; margin:0 3px 0 0; }

/* ── 计时器 ── */
.tm-stage { display:flex; flex-direction:column; align-items:center; padding:6px 0 0; }
.tm-ring { position:relative; width:280px; height:280px; max-width:70vw; max-height:70vw; }
.tm-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.tm-rem { position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }
.tm-rem .t { color:var(--hi); font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; }
.tm-rem .s { color:var(--dim); font-size:13px; margin-top:4px; }
.tm-set { display:flex; gap:6px; align-items:center; justify-content:center;
          margin-top:14px; flex-wrap:wrap; }
.tm-chip { border:1px solid var(--border); background:var(--track); color:var(--soft);
           border-radius:10px; padding:6px 12px; font-size:13px; }
.tm-chip.on { background:var(--press); color:var(--hi); border-color:var(--accent); }
.tm-ctrl { display:flex; gap:10px; justify-content:center; margin-top:14px; }
.tm-btn { width:110px; height:44px; border-radius:14px; border:1px solid var(--border);
          background:var(--press); color:var(--hi); font-size:16px; }
.tm-btn.ghost { background:var(--track); color:var(--soft); }
.tm-btn:active { opacity:.8; }

/* ── 窄屏单列 (iPad 竖屏 / 手机) ── */
@media (max-width:999px) {
  .main { flex-direction:column; }
  .hero { flex:none; width:auto; }
  .chips { max-height:none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="main">

    <!-- ── Hero: 时钟/日期/农历/星期/天气/每日一句/新股申购 ── -->
    <section class="card hero" id="hero">
      <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
      <div class="hero-sub" id="date">--</div>
      <div class="hero-sub" id="lunar" style="font-size:15px;">农历 --</div>
      <div class="wx"><span id="wx-t">--°C</span><span class="cond" id="wx-c"></span></div>
      <div class="rule"></div>
      <div class="sent" id="sent" title="点击换一句">
        <div class="sent-en" id="sent-en">--</div>
        <div class="sent-cn dim" id="sent-cn"></div>
      </div>
      <div class="ipo" id="ipo" hidden>
        <div class="ipo-t soft">新股申购</div>
        <div class="ipo-list" id="ipo-list"></div>
      </div>
      <div class="hero-foot">
        <button class="tbtn" id="btn-theme">🎨 主题</button>
        <span class="dim" id="theme-name"></span>
      </div>
    </section>

    <!-- ── 右列 01-06 ── -->
    <section class="col">
      <div class="card c0">
        <div class="head"><span class="idx">01</span><span class="nm">GLM 用量</span>
          <span class="nm r">DeepSeek 余额</span></div>
        <div class="body glm-grid">
          <div class="grow">
            <div class="val" id="glm">--</div>
            <div class="sub dim" id="glm-sub"></div>
          </div>
          <div class="val" id="ds" style="flex:none;">--</div>
        </div>
      </div>

      <div class="card c1">
        <div class="head"><span class="idx">02</span><span class="nm">提醒 / 日程</span></div>
        <div class="body agenda">
          <div class="a1" id="ag1">--</div>
          <div class="a2" id="ag2"></div>
        </div>
      </div>

      <div class="card c2">
        <div class="head"><span class="idx">03</span><span class="nm">AI 新闻</span>
          <span class="fr" id="news-date"></span></div>
        <div class="news" id="news" title="点击看下一条">
          <div class="n1" id="news-t">--</div>
          <div class="n2" id="news-s"></div>
        </div>
      </div>

      <div class="card c3">
        <div class="head"><span class="idx">04</span><span class="nm">健康</span>
          <span class="fr" id="h-time" title="数据时间">--:--</span></div>
        <div class="body hgrid" id="hgrid"></div>
      </div>

      <div class="card c3">
        <div class="head"><span class="idx">05</span><span class="nm"><span class="dot" id="opi-dot"></span>OPi 状态</span>
          <span class="fr" id="opi-up">--</span></div>
        <div class="body ogrid" id="ogrid"></div>
      </div>

      <div class="card c1">
        <div class="head"><span class="idx">06</span><span class="nm">收音机</span>
          <span class="fr" id="r-stat">加载电台…</span></div>
        <div class="body">
          <div class="chips" id="chips"></div>
          <div class="rctrl">
            <button class="pbtn" id="r-play" title="播放/暂停">⏵</button>
            <input class="rvol" id="r-vol" type="range" min="0" max="100" value="80">
            <span class="rstat" id="r-cur">点击电台开始播放</span>
          </div>
        </div>
      </div>
    </section>

0x0d520];
// Howard Hinnant days_from_civil: 自 0000-03-01 起的连续纪日
function daysFromCivil(y, m, d) {
  y -= (m <= 2) ? 1 : 0;
  const era = Math.floor((y >= 0 ? y : y - 399) / 400);
  const yoe = y - era * 400;
  const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}
function leapMonthOf(ly)   { return LUNAR_INFO[ly - 1900] & 0xf; }
function leapDaysOf(ly)    { const lm = leapMonthOf(ly);
                             return lm ? ((LUNAR_INFO[ly - 1900] & 0x10000) ? 30 : 29) : 0; }
function monthDaysOf(ly, m){ return (LUNAR_INFO[ly - 1900] & (0x10000 >> m)) ? 30 : 29; }
function yearDaysOf(ly) {
  let sum = 348;
  for (let bit = 0x8000; bit > 0x8; bit >>= 1)
    if (LUNAR_INFO[ly - 1900] & bit) ++sum;
  return sum + leapDaysOf(ly);
}
const LM_CHARS = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const LD_CHARS = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                  "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                  "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
function solarToLunar(y, m, d) {
  if (y < 1900 || y > 2100) return null;
  let rest = daysFromCivil(y, m, d) - daysFromCivil(1900, 1, 31);
  if (rest < 0) return null;
  let ly = 1900;
  for (;;) {
    const yd = yearDaysOf(ly);
    if (rest < yd) break;
    rest -= yd;
    if (++ly > 2100) return null;
  }
  const leap = leapMonthOf(ly);
  let lm = 1, isLeap = false;
  for (let ord = 1; ord <= 12; ++ord) {
    const md = monthDaysOf(ly, ord);
    if (rest < md) { lm = ord; isLeap = false; break; }
    rest -= md;
    if (leap === ord) {
      const ld = leapDaysOf(ly);
      if (rest < ld) { lm = ord; isLeap = true; break; }
      rest -= ld;
    }
    if (ord === 12) return null;
  }
  return { y: ly, m: lm, d: rest + 1, leap: isLeap };
}
function lunarText(y, m, d) {
  const ld = solarToLunar(y, m, d);
  if (!ld) return "";
  return (ld.leap ? "闰" : "") + LM_CHARS[ld.m - 1] + "月" + LD_CHARS[ld.d - 1];
}

let _warned401 = false;
async function getJSON(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 10000);
  try {
    const r = await fetch(url, { signal: ctl.signal, credentials: "same-origin" });
    if (!r.ok) { note401(r.status); return null; }
    return await r.json();
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}
function setText(id, txt) {   // 变了才写, 免无谓重排
  const el = $(id);

}

  const items = [];

  for (const sec of secs) {
    const label = sec.label || "新闻";
    const its = Array.isArray(sec.items) ? sec.items : [];
    for (const it of its) {
      if (typeof it !== "string" || !it) continue;
      items.push({ t: "【" + label + "】" + it, s: "AI 新闻 · " + (j.date || "") });
      if (items.length >= 12) break;
    }
    if (items.length >= 12) break;
  }
  if (items.length) {
    newsItems = items;
    if (newsIdx >= newsItems.length) newsIdx = 0;
    renderNews();
  }
}

  if (!newsItems.length) return;
  const it = newsItems[newsIdx % newsItems.length];

let stations = [], curKey = null, wantPlay = false;
let vol = 80;
try { vol = Math.max(0, Math.min(100, parseInt(localStorage.getItem("car_vol"), 10) || 80)); } catch (e) {}

/* ════ V2 通用: 面板框架 ════ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function note401(status) {
  if (status === 401 && !_warned401) {
    _warned401 = true;
    toast("登录态已过期, 请刷新页面重新登录", 5000);
  }
}
async function postJSON(url, body, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 10000);
  try {
    const r = await fetch(url, { method:"POST", signal:ctl.signal, credentials:"same-origin",
      headers: { "Content-Type":"application/json", "X-Tab5-Web":"1" },   // CSRF: 网关要求非 GET 带此头
      body: JSON.stringify(body) });
    if (!r.ok) { note401(r.status); return null; }
    try { return await r.json(); } catch (e) { return { ok:true }; }
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}
function cssv(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function fmtTime(d) {
  const p = v => String(v).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
}

const PANEL_OPENERS = {};   // name → {open, close}
let panelNow = null;
function openPanel(name) {
  if (panelNow === name) return;
  closePanel();
  panelNow = name;
  const p = $("p-" + name);
  if (!p) { panelNow = null; return; }
  p.classList.add("open");
  document.body.style.overflow = "hidden";
  if (PANEL_OPENERS[name] && PANEL_OPENERS[name].open) PANEL_OPENERS[name].open();
}
function closePanel() {
  if (!panelNow) return;
  const m = PANEL_OPENERS[panelNow];
  if (m && m.close) m.close();
  const p = $("p-" + panelNow);
  if (p) p.classList.remove("open");
  document.body.style.overflow = "";
  panelNow = null;
  hideViewer();
}
document.querySelectorAll('.panel .p-close[data-close]').forEach(b =>
  b.addEventListener("click", closePanel));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("viewer").classList.contains("open")) { hideViewer(); return; }
  closePanel();
});

/* ════ V2 家居: HA 设备控制 (网关注入 token, POST 需 X-Tab5-Web) ════ */
const HA_DOMAINS = ["light", "switch", "fan", "cover", "climate"];
const HA_SEC_NAMES = { light:"灯光", switch:"开关/插座", fan:"风扇", cover:"窗帘", climate:"空调温控" };
let haTimer = 0, haEntities = null;
function haName(e) { return (e.attributes && e.attributes.friendly_name) || e.entity_id; }
async function haFetch() {
  const j = await getJSON("/gw/8123/api/states", 12000);
  if (!Array.isArray(j)) return false;
  haEntities = j.filter(e => {
    const d = e.entity_id.split(".")[0];
    return HA_DOMAINS.includes(d) && !(e.attributes && e.attributes.hidden);
  }).slice(0, 80);
  return true;
}
function haStateTxt(e) {
  const s = e.state;
  if (s === "on") return "开"; if (s === "off") return "关";
  if (s === "unavailable" || s === "unknown") return "不可用";
  return s;
}
function haRowHTML(e) {
  const dom = e.entity_id.split(".")[0], on = e.state === "on",
        bad = e.state === "unavailable" || e.state === "unknown";
  let ctrl = "";
  if (bad) ctrl = "";
  else if (dom === "cover")
    ctrl = '<button class="ha-btn" data-svc="open_cover">开</button>' +
           '<button class="ha-btn" data-svc="close_cover">关</button>' +
           '<button class="ha-btn" data-svc="stop_cover">停</button>';
  else if (dom === "climate") {
    const at = e.attributes || {};
    const cur = (at.current_temperature != null) ? Math.round(at.current_temperature) + "℃ " : "";
    ctrl = '<button class="ha-btn" data-act="t-" style="min-width:40px;">−</button>' +
           '<span class="ha-temp">' + cur + Math.round(at.temperature || 0) + "℃</span>" +
           '<button class="ha-btn" data-act="t+" style="min-width:40px;">＋</button>' +
           '<button class="ha-btn' + (on ? " on" : "") + '" data-svc="' + (on ? "turn_off" : "turn_on") + '">' +
           (on ? "开" : "关") + "</button>";
  } else
    ctrl = '<button class="ha-btn' + (on ? " on" : "") + '" data-svc="' + (on ? "turn_off" : "turn_on") + '">' +
           (on ? "开" : "关") + "</button>";
  return '<div class="ha-row" data-eid="' + esc(e.entity_id) + '">' +
         '<span class="ha-name">' + esc(haName(e)) + "</span>" +
         '<span class="ha-st">' + esc(haStateTxt(e)) + "</span>" + ctrl + "</div>";
}
function renderHa() {
  if (!haEntities) return;
  const body = $("ha-body");
  if (!haEntities.length) {
    body.innerHTML = '<div class="dim" style="text-align:center;padding:48px 0;">' +
                     "HA 里没有可控制设备 (light/switch/fan/cover/climate)</div>";
    setText("ha-sub", "0 台设备");
    return;
  }
  let html = "";
  for (const dom of HA_DOMAINS) {
    const list = haEntities.filter(e => e.entity_id.split(".")[0] === dom)
                           .sort((a, b) => haName(a).localeCompare(haName(b), "zh"));
    if (!list.length) continue;
    html += '<div class="sec">' + HA_SEC_NAMES[dom] + " · " + list.length + "</div>" +
            list.map(haRowHTML).join("");
  }
  body.innerHTML = html;
  setText("ha-sub", haEntities.length + " 台设备 · " + fmtTime(new Date()));
}
async function haCall(svcPath, body) {   // svcPath 形如 light/turn_on
  const r = await postJSON("/gw/8123/api/services/" + svcPath, body, 8000);
  setTimeout(() => { if (panelNow === "ha") haFetch().then(ok => { if (ok) renderHa(); }); }, 1200);
  return r;
}
$("ha-body").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const row = btn.closest(".ha-row");
  if (!row) return;
  const eid = row.dataset.eid, dom = eid.split(".")[0];
  if (btn.dataset.svc) haCall(dom + "/" + btn.dataset.svc, { entity_id: eid });
  else if (btn.dataset.act === "t-" || btn.dataset.act === "t+") {
    const ent = haEntities.find(x => x.entity_id === eid);
    if (!ent) return;
    const at = ent.attributes || {};

          hi = at.max_temp != null ? at.max_temp : 30;
    let t = (at.temperature || 24) + (btn.dataset.act === "t+" ? 0.5 : -0.5);
    t = Math.max(lo, Math.min(hi, Math.round(t * 2) / 2));
    haCall("climate/set_temperature", { entity_id: eid, temperature: t });
  }
});

};

const IDX_LIST = [
  ["上证指数", "sh000001"], ["深证成指", "sz399001"], ["创业板指", "sz399006"],
  ["科创综指", "sh000688"], ["沪深300",  "sh000300"], ["恒生指数", "r_hkHSI"],
  ["道琼斯",   "usDJI"],    ["纳斯达克", "usIXIC"],   ["标普500",  "usINX"],
];
const qtCode = code => (String(code)[0] === "6" ? "sh" : "sz") + code;
const chgCls = v => v > 0.005 ? "up" : (v < -0.005 ? "down" : "flat");
let finStocks = [], finTimer = 0, idxTimer = 0;
const chart = { code:null, name:"", view:"min", minute:null, day:null };

function parseQtText(txt) {   // → { code: [fields...] }  (r_hkHSI 等带下划线)
  const out = {};
  const re = /v_([a-zA-Z0-9_]+)="([^"]*)"/g;
  let m;
  while ((m = re.exec(txt)) !== null) out[m[1]] = m[2].split("~");
  return out;
}
function qtFieldsOk(f) {
  return f && (parseFloat(f[3]) > 0) && (parseFloat(f[4]) > 0);
}
async function finFetchStocks() {
  const j = await getJSON("/gw/8766/api/stocks/portfolio");
  if (!j || !Array.isArray(j.items)) return;   // 该端点无 ok 字段 (设备端同款)

  finFetchQuotes();

      esc(s.code) + "</span></div>" +

      '<div class="fchg ' + cls + '">' + (s.chg ? (s.chg > 0 ? "+" : "") + s.chg.toFixed(2) : "--") +
      "  " + (s.pchg ? (s.pchg > 0 ? "+" : "") + s.pchg.toFixed(2) + "%" : "--") + "</div>" +
      (s.one_sentence ? '<div class="fsen" title="' + esc(s.one_sentence) + '">' + esc(s.one_sentence) + "</div>" : "") +
      "</div>";
  }).join("");
  setText("fin-sub", finStocks.length + " 只自选 · " + fmtTime(new Date()));
}
async function finFetchQuotes() {
  if (!finStocks.length) return;
  const codes = finStocks.map(s => qtCode(s.code)).join(",");
  // qt 返回非 JSON 文本, 走裸 fetch:

}
function renderFinIdx(qt) {

  drawChart();
}));
async function fetchText(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const r = await fetch(url, { signal: ctl.signal, credentials: "same-origin" });
    if (!r.ok) { note401(r.status); return null; }
    return await r.text();
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}
async function openChart(code, name) {
  chart.code = code; chart.name = name || code;
  chart.minute = null; chart.day = null;
  $("chart-wrap").hidden = false;
  setText("chart-title", name + " · " + code);
  $("chart-metrics").textContent = "加载中…";
  $("chart-wrap").scrollIntoView({ behavior:"smooth", block:"nearest" });
  const [minTxt, dayTxt, qtTxt] = await Promise.all([
    fetchText("/gw/ext/ifzq/appstock/app/minute/query?code=" + code),
    fetchText("/gw/ext/ifzq/appstock/app/fqkline/get?param=" + code + ",day,,,250,qfq"),
    fetchText("/gw/ext/qt/q=" + code),
  ]);
  if (chart.code !== code) return;   // 期间换了股票
  try {
    const j = JSON.parse(minTxt);
    if (j && j.code === 0 && j.data && j.data[code]) {
      const rows = (j.data[code].data && j.data[code].data.data) || [];
      chart.minute = {
        prices: rows.map(s => parseFloat(String(s).split(" ")[1])).filter(v => !isNaN(v)),
        qt: (j.data[code].qt && j.data[code].qt[code]) || null,
      };
    }
  } catch (e) {}
  try {
    const j = JSON.parse(dayTxt);
    if (j && j.code === 0 && j.data && j.data[code]) {
      const node = j.data[code], arr = node.qfqday || node.day || [];
      chart.day = arr.filter(r => Array.isArray(r) && r.length >= 5).map(r => ({
        d: r[0], o: parseFloat(r[1]), c: parseFloat(r[2]),
        h: parseFloat(r[3]), l: parseFloat(r[4]),
        v: r.length > 5 ? parseFloat(r[5]) || 0 : 0,
      }));
    }
  } catch (e) {}
  // 指标跑马灯: 优先 minute 内嵌 qt 节点, 兜底 /gw/ext/qt
  let qf = chart.minute && chart.minute.qt;
  if (!qf && qtTxt) qf = parseQtText(qtTxt)[code];
  if (qf && qf.length > 40) {
    const num = s => { const v = parseFloat(s); return isNaN(v) ? 0 : v; };
    let m = "";
    if (qf[3]) m += num(qf[3]).toFixed(2);
    if (qf[31]) m += "  " + (num(qf[31]) >= 0 ? "+" : "") + num(qf[31]).toFixed(2);
    if (qf[32]) m += "  " + (num(qf[32]) >= 0 ? "+" : "") + num(qf[32]).toFixed(2) + "%";
    if (qf[37]) { const v = num(qf[37]);
      m += "   成交额 " + (v >= 10000 ? (v / 10000).toFixed(2) + "亿" : v.toFixed(0) + "万"); }
    if (qf[38]) m += "   换手 " + num(qf[38]).toFixed(2) + "%";
    if (qf[49]) m += "   量比 " + num(qf[49]).toFixed(2);
    if (qf[39]) m += "   PE " + num(qf[39]).toFixed(2);
    $("chart-metrics").textContent = m;
  } else $("chart-metrics").textContent = "";
  if (!chart.minute || !chart.minute.prices.length) {   // 无分时 (港美指) 自动切日K
    chart.view = "day";
    document.querySelectorAll("#p-fin .ptab").forEach(x => x.classList.toggle("on", x.dataset.cv === "day"));
  }
  drawChart();
}
function chartCtx() {
  const c = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 800, h = 420;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function drawChart() {
  if (!chart.code) return;
  if (chart.view === "min") {
    if (chart.minute && chart.minute.prices.length) drawMinute();
    else if (chart.day && chart.day.length) drawDayK();
    else chartEmpty("暂无数据");
  } else {
    if (chart.day && chart.day.length) drawDayK();
    else chartEmpty("暂无日K数据");
  }
}
function chartEmpty(msg) {
  const { ctx, w, h } = chartCtx();
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = cssv("--dim"); ctx.font = "14px sans-serif";
  ctx.textAlign = "center"; ctx.fillText(msg, w / 2, h / 2);
}
function drawMinute() {
  const { ctx, w, h } = chartCtx();
  const prices = chart.minute.prices, prev = chart.minute.qt ? parseFloat(chart.minute.qt[4]) : NaN;
  const padL = 52, padR = 14, padT = 14, padB = 22;
  const pw = w - padL - padR, ph = h - padT - padB, n = prices.length;
  let lo = Math.min(...prices), hi = Math.max(...prices);
  if (!isNaN(prev)) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (!isFinite(lo) || hi <= 0) return;
  if (hi - lo < hi * 0.001) { hi += hi * 0.001; lo -= hi * 0.001; }
  const m = (hi - lo) * 0.08; hi += m; lo -= m;
  const X = i => padL + (n <= 1 ? pw / 2 : i / (n - 1) * pw);
  const Y = p => padT + (hi - p) / (hi - lo) * ph;
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px sans-serif"; ctx.textBaseline = "middle";
  // 网格 + 左轴价签
  ctx.strokeStyle = cssv("--border"); ctx.fillStyle = cssv("--dim");
  for (let k = 0; k <= 4; k++) {
    const y = padT + ph * k / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.textAlign = "right";
    ctx.fillText((hi - (hi - lo) * k / 4).toFixed(2), padL - 6, y);
  }
  // 昨收虚线
  if (!isNaN(prev)) {
    ctx.setLineDash([5, 4]); ctx.strokeStyle = cssv("--dim");
    ctx.beginPath(); ctx.moveTo(padL, Y(prev)); ctx.lineTo(w - padR, Y(prev)); ctx.stroke();
    ctx.setLineDash([]);
  }
  const col = !isNaN(prev) && prices[n - 1] < prev ? cssv("--ok") : cssv("--danger");
  // 面积
  ctx.beginPath(); ctx.moveTo(X(0), Y(prices[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(X(i), Y(prices[i]));
  ctx.lineTo(X(n - 1), padT + ph); ctx.lineTo(X(0), padT + ph); ctx.closePath();
  ctx.globalAlpha = 0.13; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
  // 折线
  ctx.beginPath(); ctx.moveTo(X(0), Y(prices[0]));
  for (let i = 1; i < n; i++) ctx.lineTo(X(i), Y(prices[i]));
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke(); ctx.lineWidth = 1;
  // 时间轴
  ctx.fillStyle = cssv("--dim"); ctx.textAlign = "center";
  ctx.fillText("09:30", padL, h - 9);
  ctx.fillText("11:30/13:00", padL + pw / 2, h - 9);
  ctx.fillText("15:00", w - padR, h - 9);
}
function drawDayK() {
  const { ctx, w, h } = chartCtx();
  const bars = chart.day, n = bars.length;
  const padL = 52, padR = 14, padT = 26, padB = 22;
  const pw = w - padL - padR;
  const volH = Math.min(60, (h - padT - padB) * 0.18);
  const priceH = h - padT - padB - volH - 10;
  const closes = bars.map(b => b.c);
  const ma = (k) => closes.map((_, i) =>
    i < k - 1 ? NaN : closes.slice(i - k + 1, i + 1).reduce((a, b) => a + b, 0) / k);
  const ma5 = ma(5), ma10 = ma(10), ma20 = ma(20);
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
  for (const arr of [ma5, ma10, ma20])
    for (const v of arr) if (!isNaN(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const mg = (hi - lo) * 0.05; hi += mg; lo -= mg;
  const maxV = Math.max(...bars.map(b => b.v)) || 1;
  const X = i => padL + (i + 0.5) / n * pw;
  const Y = p => padT + (hi - p) / (hi - lo) * priceH;
  const bw = Math.max(1.2, pw / n * 0.62);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px sans-serif"; ctx.textBaseline = "middle";
  ctx.strokeStyle = cssv("--border"); ctx.fillStyle = cssv("--dim");
  for (let k = 0; k <= 4; k++) {
    const y = padT + priceH * k / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.textAlign = "right";
    ctx.fillText((hi - (hi - lo) * k / 4).toFixed(2), padL - 6, y);
  }
  for (let i = 0; i < n; i++) {
    const b = bars[i], up = b.c >= b.o, col = up ? cssv("--danger") : cssv("--ok");
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(X(i), Y(b.h)); ctx.lineTo(X(i), Y(b.l)); ctx.stroke();
    const y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c));
    ctx.fillRect(X(i) - bw / 2, y1, bw, Math.max(1, y2 - y1));
    ctx.globalAlpha = 0.55;
    const vh = b.v / maxV * volH;
    ctx.fillRect(X(i) - bw / 2, padT + priceH + 10 + (volH - vh), bw, vh);
    ctx.globalAlpha = 1;
  }
  // MA 线 + 图例 (左上角, 设备同款)
  const mas = [[ma5, cssv("--accent"), "MA5"], [ma10, cssv("--warn"), "MA10"], [ma20, cssv("--soft"), "MA20"]];
  ctx.textAlign = "left";
  mas.forEach(([arr, col, label], k) => {
    ctx.strokeStyle = col; ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      if (isNaN(arr[i])) continue;
      if (!started) { ctx.moveTo(X(i), Y(arr[i])); started = true; }
      else ctx.lineTo(X(i), Y(arr[i]));
    }
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.fillText(label, padL + 4 + k * 52, padT - 10);
  });
  // 日期轴 4 刻度
  ctx.fillStyle = cssv("--dim"); ctx.textAlign = "center";
  for (let k = 0; k < 4; k++) {
    const i = Math.round((n - 1) * k / 3);
    ctx.fillText(bars[i].d.slice(5), Math.min(w - 24, Math.max(padL + 18, X(i))), h - 9);
  }
}

/* ════ V2 计时器 (纯前端; 关面板继续跑, 结束 toast+蜂鸣) ════ */
const TM_C = 2 * Math.PI * 126;
let tmDur = 300, tmLeft = 300, tmRun = false, tmTimer = 0, tmEndAt = 0, tmCtxAudio = null, tmDone = false;
const TM_PRESETS = [1, 3, 5, 10, 30, 60];
function tmFmt(s) {
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = v => String(v).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(sec) : p(m) + ":" + p(sec);
}
function tmRender() {
  setText("tm-display", tmFmt(tmLeft));
  const frac = tmDur > 0 ? tmLeft / tmDur : 0;
  const prog = $("tm-prog");
  prog.style.strokeDasharray = TM_C;
  prog.style.strokeDashoffset = TM_C * (1 - frac);
  prog.style.stroke = tmRun ? cssv("--accent") : cssv("--dim");
  $("tm-track").style.stroke = cssv("--card1");
  if (tmDone) setText("tm-state", "计时结束!");
  else if (tmRun) setText("tm-state", "运行中 · " + fmtTime(new Date(tmEndAt)) + " 结束");
  else setText("tm-state", tmLeft < tmDur ? "已暂停" : "点预设设定时长");
  document.querySelectorAll("#tm-chips .tm-chip").forEach(c =>
    c.classList.toggle("on", !tmRun && !tmDone && +c.dataset.min * 60 === tmDur));
  $("tm-start").textContent = tmRun ? "暂停" : (tmLeft > 0 && tmLeft < tmDur ? "继续" : "开始");
}
function tmBeep() {
  try {
    tmCtxAudio = tmCtxAudio || new (window.AudioContext || window.webkitAudioContext)();
    for (let k = 0; k < 3; k++) {
      const o = tmCtxAudio.createOscillator(), g = tmCtxAudio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(tmCtxAudio.destination);
      const t0 = tmCtxAudio.currentTime + k * 0.45;
      g.gain.setValueAtTime(0.001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
      o.start(t0); o.stop(t0 + 0.4);
    }
  } catch (e) {}
}
function tmTick() {
  tmLeft = Math.max(0, (tmEndAt - Date.now()) / 1000);
  if (tmLeft <= 0) {
    tmRun = false; tmDone = true; clearInterval(tmTimer); tmTimer = 0;
    tmBeep(); toast("⏰ 计时结束");
  }
  tmRender();
}
$("tm-chips").innerHTML = TM_PRESETS.map(m =>
  '<button class="tm-chip" data-min="' + m + '">' + m + " 分钟</button>").join("");
$("tm-chips").addEventListener("click", e => {
  const c = e.target.closest(".tm-chip");
  if (!c || tmRun) return;
  tmDur = tmLeft = +c.dataset.min * 60; tmDone = false;
  clearInterval(tmTimer); tmTimer = 0; tmRender();
});
$("tm-start").addEventListener("click", () => {
  if (tmRun) {   // 暂停
    tmRun = false; clearInterval(tmTimer); tmTimer = 0;
  } else {
    if (tmLeft <= 0) tmLeft = tmDur;
    tmDone = false; tmRun = true;
    tmEndAt = Date.now() + tmLeft * 1000;
    try { tmCtxAudio = tmCtxAudio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    tmTimer = setInterval(tmTick, 250);
  }
  tmRender();
});
$("tm-reset").addEventListener("click", () => {
  tmRun = false; tmDone = false; clearInterval(tmTimer); tmTimer = 0;
  tmLeft = tmDur; tmRender();
});
PANEL_OPENERS.timer = { open() { tmRender(); }, close() {} };

/* ── 万年历: 复用已移植农历表 + 生肖 (与 app_calendar 同约定) ── */
const LM_FULL = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
const ZODIAC = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
let calY = 0, calM = 0;
function zodiacOf(lunarYear) { return ZODIAC[((lunarYear - 4) % 12 + 12) % 12]; }
function renderCal() {
  const first = new Date(calY, calM - 1, 1).getDay();
  const days = new Date(calY, calM, 0).getDate();
  const today = new Date();
  let html = '<div class="cal-head"><span class="cal-title">' + calY + " 年 " + calM + " 月</span>" +
    '<button class="cal-btn" data-nav="-1">‹ 上月</button>' +
    '<button class="cal-btn" data-nav="1">下月 ›</button>' +
    '<button class="cal-btn" data-nav="0">今天</button></div><div class="cal-grid">';
  for (let k = 0; k < 7; k++)
    html += '<div class="cal-wd' + (k === 0 || k === 6 ? " we" : "") + '">' + "日一二三四五六"[k] + "</div>";
  for (let slot = 0; slot < 42; slot++) {
    const d = slot - first + 1;
    if (d < 1 || d > days) { html += '<div class="cal-cell pad"></div>'; continue; }
    const we = slot % 7 === 0 || slot % 7 === 6;
    const ld = solarToLunar(calY, calM, d);
    const lunar = ld ? (ld.leap ? "闰" : "") + (ld.d === 1 ? LM_FULL[ld.m - 1] : LD_CHARS[ld.d - 1]) : "";
    const isToday = today.getFullYear() === calY && today.getMonth() + 1 === calM && today.getDate() === d;
    html += '<div class="cal-cell' + (we ? " we" : "") + (isToday ? " today" : "") + '">' +
            '<div class="cd">' + d + '</div><div class="cl">' + lunar + "</div></div>";
  }
  html += "</div>";
  const tld = solarToLunar(today.getFullYear(), today.getMonth() + 1, today.getDate());
  if (tld) {
    const wd = "日一二三四五六"[today.getDay()];
    html += '<div class="cal-detail">' + today.getFullYear() + "年" + (today.getMonth() + 1) + "月" +
      today.getDate() + "日 星期" + wd + "　农历" + (tld.leap ? "闰" : "") + LM_FULL[tld.m - 1] +
      LD_CHARS[tld.d - 1] + " " + zodiacOf(tld.y) + "年</div>";
  }
  $("tool-view").innerHTML = html;
}
$("tool-view").addEventListener("click", e => {
  const b = e.target.closest(".cal-btn");

  else { calM += nav; if (calM < 1) { calM = 12; calY--; } if (calM > 12) { calM = 1; calY++; } }

});

const FX_CODES = ["USD","CNY","EUR","JPY","GBP","HKD","KRW","AUD"];

let fxRates = null, fxUpdated = "";
const UCATS = {
  "长度": [["mm",0.001],["cm",0.01],["m",1],["km",1000],["in",0.0254],["ft",0.3048],["yd",0.9144],["mi",1609.344]],
  "重量": [["mg",0.001],["g",1],["kg",1000],["t",1e6],["oz",28.3495],["lb",453.592]],
  "温度": [["°C",0],["°F",1],["K",2]],
  "面积": [["mm²",1e-6],["cm²",1e-4],["m²",1],["km²",1e6],["ha",1e4],["亩",666.6667],["acre",4046.86],["ft²",0.092903]],
  "体积": [["mL",0.001],["L",1],["m³",1000],["gal",3.78541],["cup",0.236588]],
  "速度": [["m/s",1],["km/h",0.277778],["mph",0.44704],["kn",0.514444]],
  "数据": [["B",1],["KB",1024],["MB",1048576],["GB",1073741824],["TB",1099511627776]],

let cvMode = "fx", cvCat = "长度";
function cvSel(id, opts, sel) {
  return '<select id="' + id + '">' + opts.map(o =>
    '<option value="' + esc(o) + '"' + (o === sel ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select>";
}
function tempConvert(v, from, to) {   // → °C 中转
  const c = from === "°C" ? v : (from === "°F" ? (v - 32) * 5 / 9 : v - 273.15);
  return to === "°C" ? c : (to === "°F" ? c * 9 / 5 + 32 : c + 273.15);
}
function cvConvert() {
  if (cvMode === "fx") {
    const v = parseFloat($("fx-amt").value);
    const from = $("fx-from").value, to = $("fx-to").value;
    if (isNaN(v)) { $("fx-res").textContent = "--"; return; }
    const r = fxRates || FX_FALLBACK;
    $("fx-res").textContent = (v / r[from] * r[to]).toLocaleString("zh-CN",
      { maximumFractionDigits: 4 }) + " " + FX_NAMES[to];
  } else {
    const v = parseFloat($("u-amt").value);
    const from = $("u-from").value, to = $("u-to").value;
    if (isNaN(v)) { $("u-res").textContent = "--"; return; }
    if (cvCat === "温度") {
      $("u-res").textContent = tempConvert(v, from, to)
        .toLocaleString("zh-CN", { maximumFractionDigits: 2 }) + " " + to;
    } else {
      const f = Object.fromEntries(UCATS[cvCat]);
      $("u-res").textContent = (v * f[from] / f[to])
        .toLocaleString("zh-CN", { maximumFractionDigits: 6 }) + " " + to;

  if (cvMode === "fx") {
    $("tool-view").innerHTML =
      '<div class="p-tabs"><button class="ptab on" data-cvm="fx">汇率</button>' +
      '<button class="ptab" data-cvm="unit">单位</button></div>' +
      '<div class="cv-row"><input id="fx-amt" type="number" value="1" inputmode="decimal">' +
      cvSel("fx-from", FX_CODES, "USD") + '<button class="cv-swap" id="fx-swap">⇄</button>' +
      cvSel("fx-to", FX_CODES, "CNY") + "</div>" +
      '<div class="cv-res" id="fx-res">--</div>' +
      '<div class="cv-upd" id="fx-upd">' + (fxRates ? fxUpdated : "拉取实时汇率…失败自动用静态表") + "</div>";
    $("fx-swap").addEventListener("click", () => {
      const a = $("fx-from").value; $("fx-from").value = $("fx-to").value; $("fx-to").value = a; cvConvert();
    });
  } else {
    const units = UCATS[cvCat].map(u => u[0]);
    $("tool-view").innerHTML =
      '<div class="p-tabs"><button class="ptab" data-cvm="fx">汇率</button>' +
      '<button class="ptab on" data-cvm="unit">单位</button>' +
      cvSel("u-cat", Object.keys(UCATS), cvCat) + "</div>" +
      '<div class="cv-row"><input id="u-amt" type="number" value="1" inputmode="decimal">' +
      cvSel("u-from", units, units[0]) + '<button class="cv-swap" id="u-swap">⇄</button>' +
      cvSel("u-to", units, units[1] || units[0]) + "</div>" +
      '<div class="cv-res" id="u-res">--</div>';
    $("u-cat").addEventListener("change", e => { cvCat = e.target.value; renderCv(); });
    $("u-swap").addEventListener("click", () => {
      const a = $("u-from").value; $("u-from").value = $("u-to").value; $("u-to").value = a; cvConvert();
    });
  }
  $("tool-view").querySelectorAll("[data-cvm]").forEach(b => b.addEventListener("click", () => {
    cvMode = b.dataset.cvm; renderCv();
  }));
}
$("tool-view").addEventListener("input", cvConvert);
$("tool-view").addEventListener("change", e => {
  if (e.target.id === "fx-from" || e.target.id === "fx-to") cvConvert();
  if (e.target.id === "u-from" || e.target.id === "u-to") cvConvert();
});

/* ── 双色球: /gw/8766/api/ssq/history (issues[0]=最新, 与 app_lottery 同源) ── */
let ssqData = null, ssqAt = 0, ssqList = null;
function ballsHTML(reds, blue, small) {
  return reds.map(r => '<span class="ball r' + (small ? "" : "") + '">' + r + "</span>").join("") +
         '<span class="ball b">' + blue + "</span>";
}
function fmtYi(v) { return (v / 1e8).toFixed(2) + " 亿"; }
function fmtPrize(g) {
  if (!g || !g.money) return "浮动";   // 缺失/0 → 浮动 (与设备一致)
  return g.money >= 10000 ? (g.money / 10000).toFixed(2) + " 万" : g.money + " 元";
}
TOOL_INIT.ssq = function () {
  setText("tool-title", "双色球");
  const render = () => {
    const it = ssqData;
    const g1 = it.grades ? it.grades.find(g => g.level === 1) : null;
    const g2 = it.grades ? it.grades.find(g => g.level === 2) : null;
    let html = '<div class="ssq-latest"><div class="ssq-h"><span class="code">第 ' +
      esc(it.code) + " 期</span><span class='dt'>" + esc(it.date) + " 周" + esc(it.week || "") + "</span></div>" +
      ballsHTML(it.reds || [], it.blue) +
      '<div class="ssq-meta">销售额 ' + fmtYi(it.sales || 0) + " · 奖池 " + fmtYi(it.pool || 0) +
      "<br>一等奖 " + ((g1 && g1.num) || 0) + " 注 单注 " + fmtPrize(g1) +
      " · 二等奖 " + ((g2 && g2.num) || 0) + " 注 单注 " + fmtPrize(g2) + "</div></div>" +
      '<div class="sec">近 10 期</div>';
    (ssqList || []).slice(1, 11).forEach(x => {
      html += '<div class="ssq-row"><span class="icode">' + esc(x.code) + " 期 · " +
        esc((x.date || "").slice(5)) + "</span>" + ballsHTML(x.reds || [], x.blue, true) + "</div>";
    });
    $("tool-view").innerHTML = html;
  };
  if (ssqData && Date.now() - ssqAt < 10 * 60000) { render(); return; }
  setText("tool-sub", "加载中…");
  $("tool-view").innerHTML = '<div class="dim" style="text-align:center;padding:40px 0;">加载中…</div>';
  getJSON("/gw/8766/api/ssq/history").then(j => {
    if (!j || !j.ok || !Array.isArray(j.issues) || !j.issues.length) {
      setText("tool-sub", "加载失败");
      $("tool-view").innerHTML = '<div class="dim" style="text-align:center;padding:40px 0;">开奖数据不可达</div>';
      return;
    }
    ssqData = j.issues[0]; ssqList = j.issues; ssqAt = Date.now();
    setText("tool-sub", "共 " + j.count + " 期");
    render();
  });
};
