<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car · Tab5 驾驶舱</title>
<link rel="stylesheet" href="car.css">
</head>
<body>
<div class="app">
  <div class="main">

    <!-- ── Hero: 时钟/日期/农历/星期/天气/每日一句/新股申购 ── -->
    <section class="card hero" id="hero">
      <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
      <div class="hero-sub" id="date">--</div>
      <div class="hero-sub" id="lunar">农历 --</div>
      <div class="wx"><span id="wx-t">--°</span><span class="cond" id="wx-c"></span></div>
      <div class="rule"></div>
      <div class="sent" id="sent" title="点击换一句">
        <div class="sent-en" id="sent-en">--</div>
        <div class="sent-cn dim" id="sent-cn"></div>
      </div>
      <div class="ipo" id="ipo" hidden>
        <div class="ipo-t soft">新股申购</div>
        <div class="ipo-list" id="ipo-list"></div>
      </div>
      <div class="hero-foot">
        <button class="tbtn" id="btn-theme">🎨 主题</button>
        <span class="dim" id="theme-name"></span>
      </div>
    </section>

    <!-- ── 右列 01-06 ── -->
    <section class="col">
      <div class="card c0">
        <div class="head"><span class="idx">01</span><span class="nm">GLM 用量</span>
          <span class="nm r">DeepSeek 余额</span></div>
        <div class="body glm-grid">
          <div class="grow">
            <div class="val" id="glm">--</div>
            <div class="sub dim" id="glm-sub"></div>
          </div>
          <div class="val" id="ds">--</div>
        </div>
      </div>

      <div class="card c1">
        <div class="head"><span class="idx">02</span><span class="nm">提醒 / 日程</span></div>
        <div class="body agenda">
          <div class="a1" id="ag1">--</div>
          <div class="a2" id="ag2"></div>
        </div>
      </div>

      <div class="card c2">
        <div class="head"><span class="idx">03</span><span class="nm">AI 新闻</span>
          <span class="fr" id="news-date"></span></div>
        <div class="news" id="news" title="点击看下一条">
          <div class="n1" id="news-t">--</div>
          <div class="n2" id="news-s"></div>
        </div>
      </div>

      <div class="card c3">
        <div class="head"><span class="idx">04</span><span class="nm">健康</span>
          <span class="fr" id="h-time" title="数据时间">--:--</span></div>
        <div class="body hgrid" id="hgrid"></div>
      </div>

      <div class="card c3">
        <div class="head"><span class="idx">05</span><span class="nm"><span class="dot" id="opi-dot"></span>OPi 状态</span>
          <span class="fr" id="opi-up">--</span></div>
        <div class="body ogrid" id="ogrid"></div>
      </div>
    </section>
  </div>

  <!-- ── 底部 6 按钮: v2 全部可用 (小智为设备专属, 首格换家居) ── -->
  <nav class="nav" id="nav">
    <button data-panel="idea">想法</button>
    <button data-panel="ha">家居</button>
    <button data-panel="fin">金融</button>
    <button data-panel="radio">收音机</button>
    <button data-panel="timer">计时器</button>
    <button data-panel="tools">工具</button>
  </nav>
</div>

<!-- ═══ V2 面板 ═══ -->
<div class="panel" id="p-idea">
  <div class="p-head"><span class="p-title">想法</span><span class="p-sub" id="idea-sub"></span>
    <span class="idea-meta" id="idea-date">--</span>
    <span class="idea-meta" id="idea-clock">--</span>
    <span class="idea-meta">共 <span id="idea-count">0</span> 条</span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body">
    <div class="idea-main">
      <section class="record-panel">
        <header class="record-header">
          <h2 class="record-title">记录灵感</h2>
          <p class="record-hint">支持语音 + 文字，按 ⌘/Ctrl + Enter 快速保存</p>
        </header>
        <textarea class="record-textarea" id="idea-text" rows="4" spellcheck="false"
                  placeholder="此刻想到了什么？例如：在加油站旁的咖啡店拍照打卡……"></textarea>
        <div class="record-actions">
          <button class="mic-button" id="idea-mic">
            <span class="mic-icon">🎙</span><span id="idea-mic-t">按下说话</span>
          </button>
          <button class="submit-button" id="idea-save">保存灵感<span class="submit-shortcut">⌘ ↵</span></button>
        </div>
        <div class="category-selector" id="idea-cats"></div>
        <div class="speech-line" id="idea-interim"></div>
      </section>
      <section class="inspiration-list">
        <header class="list-header">
          <div class="list-title-row">
            <h2 class="list-title">灵感时间线</h2>
            <span class="list-count" id="idea-count2">0 / 0</span>
          </div>
          <div class="list-controls">
            <div class="filter-chips" id="idea-filter"></div>
            <div class="list-toolbar">
              <input type="search" class="search-input" id="idea-search" placeholder="搜索关键词…">
              <button class="link-button danger" id="idea-clear">清空</button>
            </div>
          </div>
        </header>
        <div class="list-body" id="idea-list"></div>
      </section>
    </div>
  </div>
</div>

<div class="panel" id="p-ha">
  <div class="p-head"><span class="p-title">智能家居</span><span class="p-sub" id="ha-sub"></span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body" id="ha-body"><div class="dim ph">加载中…</div></div>
</div>

<div class="panel" id="p-fin">
  <div class="p-head"><span class="p-title">金融行情</span><span class="p-sub" id="fin-sub"></span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body">
    <div class="sec">自选股（点击开走势图）</div>
    <div class="fgrid" id="fin-grid"></div>
    <div class="sec">指数看板</div>
    <div class="fgrid" id="idx-grid"></div>
    <div id="chart-wrap" hidden>
      <div class="p-tabs">
        <button class="ptab on" data-cv="min">分时</button>
        <button class="ptab" data-cv="day">日K</button>
        <span id="chart-title"></span>
      </div>
      <canvas id="chart"></canvas>
      <div id="chart-metrics"></div>
    </div>
  </div>
</div>

<div class="panel" id="p-timer">
  <div class="p-head"><span class="p-title">计时器</span><span class="p-sub" id="tm-sub"></span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body">
    <div class="tm-stage">
      <div class="tm-ring">
        <svg viewBox="0 0 280 280">
          <circle cx="140" cy="140" r="126" fill="none" stroke-width="14" id="tm-track"/>
          <circle cx="140" cy="140" r="126" fill="none" stroke-width="14"
                  stroke-linecap="round" id="tm-prog"/>
        </svg>
        <div class="tm-rem"><div class="t" id="tm-display">05:00</div>
          <div class="s" id="tm-state">点预设设定时长</div></div>
      </div>
      <div class="tm-set" id="tm-chips"></div>
      <div class="tm-ctrl">
        <button class="tm-btn" id="tm-start">开始</button>
        <button class="tm-btn ghost" id="tm-reset">重置</button>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="p-radio">
  <div class="p-head"><span class="p-title">收音机</span><span class="p-sub" id="r-stat">加载电台…</span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body">
    <div class="vu20" id="vu20"></div>
    <div class="rstat" id="r-cur">点击电台开始播放</div>
    <div class="rctrl">
      <button class="pbtn" id="r-play" title="播放/暂停">⏵</button>
      <input class="rvol" id="r-vol" type="range" min="0" max="100" value="80">
    </div>
    <div class="sec">电台</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="panel" id="p-tools">
  <div class="p-head">
    <span class="p-title" id="tool-title">工具</span><span class="p-sub" id="tool-sub"></span>
    <button class="p-close" data-close="1">✕</button></div>
  <div class="p-body">
    <div id="tool-menu"><div class="tool-grid">
      <div class="tool-card" data-tool="gallery"><div class="ticon">🖼️</div>图库</div>
      <div class="tool-card" data-tool="cal"><div class="ticon">📅</div>万年历</div>
      <div class="tool-card" data-tool="cv"><div class="ticon">💱</div>换算</div>
      <div class="tool-card" data-tool="ssq"><img class="ticon-img" src="ssq.webp" alt="双色球">双色球</div>
      <div class="tool-card" data-tool="health"><div class="ticon">❤️</div>健康</div>
    </div></div>
    <div id="tool-view" hidden></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewer-img" alt="">
  <button class="v-btn" id="v-prev">‹</button>
  <button class="v-btn" id="v-next">›</button>
  <button class="v-btn" id="v-close">✕</button>
  <div class="v-n" id="v-n"></div>
</div>

<audio id="audio" crossorigin="use-credentials" preload="none"></audio>
<div id="toast"></div>

<script src="car.js"></script>
</body>
</html>
