<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tab5">
<title>Tab5 驾驶舱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    /* 不用 position:fixed: macOS Chrome 全屏切换时 fixed 元素不重排
     * (高度停在上一个状态, 2026-11-03 用户截图实锤)。absolute 挂
     * ICB 同样铺满, 回弹由 overflow:hidden + touchmove preventDefault
     * (shell.js) 负责抑制 */
    position: absolute; inset: 0;
    touch-action: none; overscroll-behavior: none;
    font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  /* touch-action 不继承:CriOS 对 html/body 上的值在 canvas 触摸上仍放行
   * 平移手势 —— 触摸目标元素上再压一层 */
  #wrap, #screen { touch-action: none; overscroll-behavior: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: none; image-rendering: auto; background: #000; }
  #loader {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #9fd4a6; gap: 14px;
  }
  #loader h1 { font-size: 22px; font-weight: 600; color: #7ec87e; letter-spacing: 2px; }
  #loader .bar { width: 260px; height: 6px; border-radius: 3px; background: #14211a; overflow: hidden; }
  #loader .bar i { display: block; height: 100%; width: 0%; background: #4d8f5c; transition: width .25s; }
  #loader .msg { color: #667; font-size: 12.5px; }
  #err { color: #e5734f; white-space: pre-wrap; max-width: 80vw; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="1280" height="720"></canvas></div>
<div id="loader">
  <h1>Tab5 驾驶舱</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="msg" id="msg">正在加载运行时…</div>
  <div id="err"></div>
</div>
<script src="shell.js"></script>
<script src="tab5web.js"></script>
</body>
</html>
